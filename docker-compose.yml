services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: warbridge_test
      POSTGRES_USER: warbridge_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warbridge_test -d warbridge_test"]
      interval: 5s
      timeout: 5s
      retries: 10
