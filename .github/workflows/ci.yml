name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: warbridge_test
          POSTGRES_USER: warbridge_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warbridge_test -d warbridge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      WARBRIDGE_ENV: test
      WARBRIDGE_TEST_DATABASE_URL: postgresql://warbridge_test@localhost:5432/warbridge_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set ephemeral test secret
        run: echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"

      - name: Install backend requirements
        run: python -m pip install -r backend_requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run PostgreSQL integration tests
        run: python -m unittest discover -s tests -p "test_postgres.py" -v

      - name: Run all Python tests and reject skips
        run: python run_tests.py

      - name: Run frontend localization tests
        run: node --test tests/frontend-localization.test.mjs

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run frontend E2E, accessibility, and keyboard tests
        run: pnpm test:e2e

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Build frontend
        run: pnpm build
